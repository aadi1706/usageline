{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usageline.fullname" . }}-dashboard
  labels:
    {{- include "usageline.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  usageline-dashboard.json: |-
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
