apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "usageline.fullname" . }}
  labels:
    {{- include "usageline.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  db-host: {{ include "usageline.dbHost" . | quote }}
  db-port: {{ .Values.config.dbPort | quote }}
  db-name: {{ .Values.config.dbName | quote }}
  db-user: {{ .Values.config.dbUser | quote }}
