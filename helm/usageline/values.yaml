image:
  repository: usageline
  # Empty means "use the chart's appVersion". kind-up.sh sets this to the built image ID.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: NodePort
  port: 80
  # Only used when type is NodePort. Must match kind/cluster.yaml.
  nodePort: 30080

# Non-secret database settings. If dbHost is empty and postgres.enabled is true,
# the in-chart dev Postgres service is used.
config:
  dbHost: ""
  dbPort: 5432
  dbName: usageline
  dbUser: usageline

# DB password. Dev default only: override with --set or use existingSecret.
# Keep it URL-safe because it is placed inside DATABASE_URL.
secret:
  dbPassword: usageline-dev-password
  # Name of a pre-existing Secret with key "db-password". If set, no Secret is created.
  existingSecret: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 3
    periodSeconds: 5

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

migration:
  enabled: true
  backoffLimit: 3

# Dev-only PostgreSQL. Use a managed database for anything real.
postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
