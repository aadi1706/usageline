name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usageline
          POSTGRES_PASSWORD: usageline
          POSTGRES_DB: usageline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usageline -d usageline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://usageline:usageline@localhost:5432/usageline_test
      TEST_DATABASE_URL: postgresql+psycopg2://usageline:usageline@localhost:5432/usageline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: usageline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint chart (defaults)
        run: helm lint helm/usageline --strict
      - name: Lint chart (monitoring enabled)
        run: helm lint helm/usageline --strict -f monitoring/usageline-values.yaml
      - name: Render chart (monitoring enabled)
        run: helm template usageline helm/usageline -f monitoring/usageline-values.yaml > /dev/null
      - name: Render kube-prometheus-stack with our values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm template kps prometheus-community/kube-prometheus-stack --version 92.1.0 \
            --namespace monitoring -f monitoring/values.yaml > /dev/null
