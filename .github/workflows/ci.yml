name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/aadi1706/usageline

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels an older run on branches and PRs, but never on main, so a publish in progress is not cut short.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: usageline
          POSTGRES_PASSWORD: usageline
          POSTGRES_DB: usageline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usageline -d usageline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://usageline:usageline@localhost:5432/usageline_test
      TEST_DATABASE_URL: postgresql+psycopg2://usageline:usageline@localhost:5432/usageline_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: usageline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint chart (defaults)
        run: helm lint helm/usageline --strict
      - name: Lint chart (monitoring enabled)
        run: helm lint helm/usageline --strict -f monitoring/usageline-values.yaml
      - name: Render chart (monitoring enabled)
        run: helm template usageline helm/usageline -f monitoring/usageline-values.yaml > /dev/null
      - name: Render kube-prometheus-stack with our values
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm template kps prometheus-community/kube-prometheus-stack --version 92.1.0 \
            --namespace monitoring -f monitoring/values.yaml > /dev/null

  terraform:
    runs-on: ubuntu-24.04
    # No AWS credentials are configured anywhere in this job: it only formats, validates and statically analyses.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Validate (no backend, no credentials)
        run: |
          for dir in terraform/bootstrap terraform/envs/dev terraform/envs/prod terraform/envs/local; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        working-directory: terraform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: checkov
        run: |
          pip install "checkov==3.3.26"  # pinned: new checkov releases add checks, so bump deliberately
          checkov -d terraform --framework terraform --compact --quiet

  # Builds the image, scans it, and only then pushes it to GHCR tagged with the commit SHA (never "latest").
  # Runs only for pushes to main, and only when every job above succeeded.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, docker, helm, terraform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # the only job allowed to push; uses the built-in GITHUB_TOKEN, no stored secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (loaded into the local Docker daemon, not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: true
      - name: Trivy scan (fails on CRITICAL with a fix available)
        run: ./scripts/trivy-scan.sh "$IMAGE_REPOSITORY:$GITHUB_SHA"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          docker push "$IMAGE_REPOSITORY:$GITHUB_SHA"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPOSITORY:$GITHUB_SHA")"
          {
            echo "### Published image"
            echo
            echo "- Tag: \`$IMAGE_REPOSITORY:$GITHUB_SHA\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
